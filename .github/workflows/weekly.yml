name: 주간 스냅샷

on:
  schedule:
    # 매주 월요일 09:00 KST (= 일요일 00:00 UTC)
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    name: 전달 지표 수집
    runs-on: ubuntu-latest
    # secrets 컨텍스트는 스텝의 if 에서 쓸 수 없다. env 로 한 번 옮겨야 조건에 쓸 수 있다.
    env:
      HAS_VAULT_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      # GoLe 은 공개 저장소라 PR·Actions 이력을 GITHUB_TOKEN 으로 읽을 수 있다.
      # (인증 없이도 200 이 떨어지지만, 토큰을 쓰면 시간당 한도가 60 → 1000 이 된다)
      #
      # 볼트(GoLe-obsidian)는 비공개라 기본으로는 체크아웃하지 않는다. 그래서
      # '빠져나간 결함'은 CI 에서 비어 있고, 로컬 실행에서만 채워진다.
      # CI 에서도 채우려면 볼트 읽기 권한이 있는 PAT 을 secrets.METRICS_TOKEN 에 넣어라.
      - name: 볼트 체크아웃 (선택)
        if: env.HAS_VAULT_TOKEN == 'true'
        uses: actions/checkout@v5
        with:
          repository: GoLe-by-Colding/GoLe-obsidian
          token: ${{ secrets.METRICS_TOKEN }}
          path: .vault

      # 집계 로직만 검증한다. 네트워크도 gh 도 필요 없다.
      - name: 자체 검증
        run: python3 collect.py --self-test

      - name: 스냅샷 수집
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -d .vault ]; then
            python3 collect.py --vault .vault
          else
            echo "::notice title=볼트 없음::빠져나간 결함은 비워 둔다 (로컬 실행에서만 채워진다)"
            python3 collect.py
          fi

      - name: 커밋
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- reports data; then
            echo "변경 없음 — 커밋하지 않는다"
            exit 0
          fi
          day="$(date -u +%Y-%m-%d)"
          {
            printf '%s\n\n' "chore(metrics): ${day} 스냅샷을 찍음"
            printf '%s\n' "- collect.py 로 PR·CI·릴리스 지표를 수집해 reports 와 data 에 넣음"
            printf '%s\n' "- 검증: 수집 스크립트가 0으로 종료했고 산출 파일이 변경됨"
          } > "${RUNNER_TEMP}/msg"
          git add reports data
          git commit -F "${RUNNER_TEMP}/msg"
          git push
